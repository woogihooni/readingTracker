<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니멀 독서 기록 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-indigo-600"><i class="fa-solid fa-book-open mr-2"></i>독서 기록장</h1>
        <div class="flex items-center space-x-2">
            <button onclick="exportCSV()" class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg text-sm font-semibold border border-emerald-200 active:bg-emerald-100">
                <i class="fa-solid fa-file-csv mr-1"></i>CSV 백업
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-md mx-auto p-4">
        
        <!-- 뷰 전환 탭 (목록 / 달력) -->
        <div class="flex bg-gray-200 p-1 rounded-xl mb-4">
            <button id="tabListBtn" onclick="switchView('list')" class="flex-1 py-2 text-base font-semibold rounded-lg bg-white text-indigo-600 shadow-sm transition">도서 및 기록 목록</button>
            <button id="tabCalendarBtn" onclick="switchView('calendar')" class="flex-1 py-2 text-base font-semibold rounded-lg text-gray-600 transition">캘린더 뷰</button>
        </div>

        <!-- [뷰 1] 도서 및 기록 목록 -->
        <div id="listView" class="space-y-4">
            <!-- 상태 필터 -->
            <div class="flex space-x-2 border-b border-gray-200 pb-2">
                <button onclick="filterBooks('all')" id="filterAll" class="text-sm px-3.5 py-1.5 rounded-full font-medium bg-indigo-600 text-white">전체</button>
                <button onclick="filterBooks('reading')" id="filterReading" class="text-sm px-3.5 py-1.5 rounded-full font-medium bg-gray-200 text-gray-600">읽는 중</button>
                <button onclick="filterBooks('completed')" id="filterCompleted" class="text-sm px-3.5 py-1.5 rounded-full font-medium bg-gray-200 text-gray-600">완독</button>
            </div>

            <!-- 도서 카드 리스트 -->
            <div id="bookListContainer" class="space-y-3">
                <!-- 동적 생성 -->
            </div>
        </div>

        <!-- [뷰 2] 캘린더 뷰 -->
        <div id="calendarView" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <!-- 월/주간 전환 및 이동 -->
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-2">
                        <button onclick="changeCalendarPeriod(-1)" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                        <h2 id="calendarTitle" class="text-lg font-bold text-gray-800">2026년 10월</h2>
                        <button onclick="changeCalendarPeriod(1)" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200"><i class="fa-solid fa-chevron-right text-sm"></i></button>
                    </div>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button onclick="setCalendarMode('month')" id="modeMonthBtn" class="text-sm px-3 py-1 rounded-md font-medium bg-white text-indigo-600 shadow-sm">월간</button>
                        <button onclick="setCalendarMode('week')" id="modeWeekBtn" class="text-sm px-3 py-1 rounded-md font-medium text-gray-600">주간</button>
                    </div>
                </div>

                <!-- 캘린더 그리드 (월간/주간 동적 렌더링) -->
                <div id="calendarGrid">
                    <!-- 동적 생성 -->
                </div>
            </div>

            <!-- 선택한 날짜의 독서 기록 요약 (월간 모드 전용) -->
            <div id="selectedDateSection" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h3 id="selectedDateTitle" class="text-base font-bold text-gray-700 mb-3">날짜를 선택하세요</h3>
                <div id="selectedDateLogs" class="space-y-2">
                    <p class="text-sm text-gray-400">기록이 없습니다.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- 플로팅 액션 버튼 (독서 기록 추가 버튼) -->
    <div class="fixed bottom-6 right-6 z-20">
        <button onclick="openRecordModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-xl transition active:scale-95">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- [모달] 도서 추가/수정 -->
    <div id="bookModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4">
            <h3 id="bookModalTitle" class="text-lg font-bold text-gray-800">새 도서 등록</h3>
            <input type="hidden" id="editBookId">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">책 제목</label>
                <input type="text" id="bookTitleInput" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="예: 어린왕자">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">저자</label>
                <input type="text" id="bookAuthorInput" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="예: 생텍쥐페리">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">독서 상태</label>
                <select id="bookStatusInput" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="reading">읽는 중</option>
                    <option value="completed">완독</option>
                </select>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeBookModal()" class="flex-1 bg-gray-100 text-gray-600 py-2.5 rounded-xl text-base font-semibold">취소</button>
                <button onclick="saveBook()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-base font-semibold">저장</button>
            </div>
        </div>
    </div>

    <!-- [모달] 독서 기록 추가/수정 -->
    <div id="recordModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4 box-border max-h-[90vh] overflow-y-auto">
            <h3 id="recordModalTitle" class="text-lg font-bold text-gray-800">독서 기록 추가</h3>
            <input type="hidden" id="editRecordId">
            <div class="w-full">
                <label class="block text-sm font-semibold text-gray-600 mb-1">대상 도서 (읽는 중인 책)</label>
                <select id="recordBookSelect" class="w-full max-w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <!-- 동적 생성 -->
                </select>
            </div>
            <div class="w-full">
                <label class="block text-sm font-semibold text-gray-600 mb-1">날짜</label>
                <input type="date" id="recordDateInput" class="w-full max-w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex space-x-2">
                <div class="flex-1">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">시작 페이지</label>
                    <input type="number" id="recordStartPageInput" oninput="calculatePages()" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="시작">
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">끝 페이지</label>
                    <input type="number" id="recordEndPageInput" oninput="calculatePages()" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="끝">
                </div>
            </div>
            <div class="bg-indigo-50 p-2.5 rounded-xl text-center">
                <span class="text-sm text-indigo-600 font-medium">총 읽은 페이지: <strong id="calculatedPages" class="text-base font-bold">0</strong> 페이지</span>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">메모 (선택)</label>
                <input type="text" id="recordMemoInput" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="간단한 소감이나 메모">
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeRecordModal()" class="flex-1 bg-gray-100 text-gray-600 py-2.5 rounded-xl text-base font-semibold">취소</button>
                <button onclick="saveRecord()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-base font-semibold">저장</button>
            </div>
        </div>
    </div>

    <!-- [뷰 3] 도서 상세/편집 화면 -->
    <div id="detailView" class="hidden space-y-4">
        <button onclick="switchView('list')" class="text-sm font-semibold text-indigo-600 flex items-center"><i class="fa-solid fa-arrow-left mr-1"></i> 목록으로 돌아가기</button>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-book mr-2 text-indigo-500"></i>도서 정보 상세 및 수정</h3>
            <input type="hidden" id="detailBookId">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">책 제목</label>
                <input type="text" id="detailTitleInput" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">저자</label>
                <input type="text" id="detailAuthorInput" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">독서 상태</label>
                <select id="detailStatusInput" class="w-full box-border border border-gray-200 rounded-xl px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="reading">읽는 중</option>
                    <option value="completed">완독</option>
                </select>
            </div>
            <button onclick="updateBookDetail()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-base font-semibold">도서 정보 수정 저장</button>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <h4 class="text-base font-bold text-gray-800">이 책의 독서 기록 내역</h4>
            <div id="detailRecordList" class="space-y-2">
                <!-- 동적 생성 -->
            </div>
        </div>
    </div>

    <script>
        let books = JSON.parse(localStorage.getItem('reading_books')) || [
            { id: '1', title: '어린왕자', author: '생텍쥐페리', status: 'reading' },
            { id: '2', title: '데미안', author: '헤르만 헤세', status: 'completed' }
        ];

        let records = JSON.parse(localStorage.getItem('reading_records')) || [
            { id: 'r1', bookId: '1', date: '2026-10-01', startPage: 1, endPage: 15, pages: 15, memo: '처음 시작!' },
            { id: 'r2', bookId: '2', date: '2026-09-28', startPage: 1, endPage: 50, pages: 50, memo: '명작이다.' },
            { id: 'r3', bookId: '2', date: '2026-09-30', startPage: 51, endPage: 120, pages: 70, memo: '완독 완료.' }
        ];

        let currentFilter = 'all';
        let currentView = 'list';
        let calendarMode = 'month';
        let currentDate = new Date();
        let selectedDateStr = new Date().toISOString().split('T')[0];

        function saveData() {
            localStorage.setItem('reading_books', JSON.stringify(books));
            localStorage.setItem('reading_records', JSON.stringify(records));
        }

        function switchView(viewName) {
            currentView = viewName;
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('calendarView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');

            document.getElementById('tabListBtn').className = "flex-1 py-2 text-base font-semibold rounded-lg text-gray-600 transition";
            document.getElementById('tabCalendarBtn').className = "flex-1 py-2 text-base font-semibold rounded-lg text-gray-600 transition";

            if (viewName === 'list') {
                document.getElementById('listView').classList.remove('hidden');
                document.getElementById('tabListBtn').className = "flex-1 py-2 text-base font-semibold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                renderBookList();
            } else if (viewName === 'calendar') {
                document.getElementById('calendarView').classList.remove('hidden');
                document.getElementById('tabCalendarBtn').className = "flex-1 py-2 text-base font-semibold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                renderCalendar();
            } else if (viewName === 'detail') {
                document.getElementById('detailView').classList.remove('hidden');
            }
        }

        function filterBooks(status) {
            currentFilter = status;
            ['all', 'reading', 'completed'].forEach(s => {
                const btn = document.getElementById(`filter${s.charAt(0).toUpperCase() + s.slice(1)}`);
                if(s === status) {
                    btn.className = "text-sm px-3.5 py-1.5 rounded-full font-medium bg-indigo-600 text-white";
                } else {
                    btn.className = "text-sm px-3.5 py-1.5 rounded-full font-medium bg-gray-200 text-gray-600";
                }
            });
            renderBookList();
        }

        function renderBookList() {
            const container = document.getElementById('bookListContainer');
            container.innerHTML = '';

            const filtered = books.filter(b => currentFilter === 'all' || b.status === currentFilter);

            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">등록된 도서가 없습니다.</div>`;
                return;
            }

            filtered.forEach(book => {
                const bookRecords = records.filter(r => r.bookId === book.id).sort((a,b) => new Date(a.date) - new Date(b.date));
                let dateStr = '';
                if(bookRecords.length > 0) {
                    const start = bookRecords[0].date.replace(/^\d{2}/, '');
                    const end = bookRecords[bookRecords.length - 1].date.replace(/^\d{2}/, '');
                    if(book.status === 'completed') {
                        dateStr = `(${start}~${end})`;
                    } else {
                        dateStr = `(${start})`;
                    }
                }

                const totalPages = bookRecords.reduce((sum, r) => sum + (parseInt(r.pages) || 0), 0);

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex-1 cursor-pointer" onclick="openDetailView('${book.id}')">
                        <div class="flex items-center space-x-2">
                            <span class="text-base font-bold text-gray-800">${book.title} <span class="text-sm font-normal text-gray-500">${dateStr}</span></span>
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium ${book.status === 'completed' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">${book.status === 'completed' ? '완독' : '읽는 중'}</span>
                        </div>
                        <p class="text-sm text-gray-400 mt-1">${book.author} | 누적 ${totalPages}페이지</p>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="toggleBookStatus('${book.id}')" class="w-9 h-9 rounded-lg bg-gray-50 text-gray-500 flex items-center justify-center hover:bg-gray-100" title="상태 전환"><i class="fa-solid fa-rotate text-sm"></i></button>
                        <button onclick="deleteBook('${book.id}')" class="w-9 h-9 rounded-lg bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleBookStatus(id) {
            const book = books.find(b => b.id === id);
            if(book) {
                book.status = book.status === 'reading' ? 'completed' : 'reading';
                saveData();
                renderBookList();
            }
        }

        function deleteBook(id) {
            if(confirm('정말 삭제하시겠습니까? 연관된 기록도 함께 삭제됩니다.')) {
                books = books.filter(b => b.id !== id);
                records = records.filter(r => r.bookId !== id);
                saveData();
                renderBookList();
            }
        }

        function openDetailView(bookId) {
            const book = books.find(b => b.id === bookId);
            if(!book) return;

            document.getElementById('detailBookId').value = book.id;
            document.getElementById('detailTitleInput').value = book.title;
            document.getElementById('detailAuthorInput').value = book.author;
            document.getElementById('detailStatusInput').value = book.status;

            renderDetailRecords(bookId);
            switchView('detail');
        }

        function renderDetailRecords(bookId) {
            const container = document.getElementById('detailRecordList');
            container.innerHTML = '';

            const bookRecords = records.filter(r => r.bookId === bookId).sort((a,b) => new Date(b.date) - new Date(a.date));

            if(bookRecords.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400">작성된 독서 기록이 없습니다.</p>`;
                return;
            }

            bookRecords.forEach(r => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-gray-50 p-3 rounded-xl text-sm";
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-700">${r.date}</span> (${r.startPage}~${r.endPage}p) : <strong class="text-indigo-600">+${r.pages}p</strong>
                        ${r.memo ? `<br><span class="text-gray-400">${r.memo}</span>` : ''}
                    </div>
                    <div class="flex space-x-1">
                        <button onclick="openRecordModalForEdit('${r.id}')" class="px-2.5 py-1.5 bg-white border border-gray-200 rounded-lg text-gray-600 text-sm">수정</button>
                        <button onclick="deleteRecord('${r.id}')" class="px-2.5 py-1.5 bg-white border border-red-200 rounded-lg text-red-500 text-sm">삭제</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateBookDetail() {
            const id = document.getElementById('detailBookId').value;
            const book = books.find(b => b.id === id);
            if(book) {
                book.title = document.getElementById('detailTitleInput').value;
                book.author = document.getElementById('detailAuthorInput').value;
                book.status = document.getElementById('detailStatusInput').value;
                saveData();
                alert('수정되었습니다.');
                switchView('list');
            }
        }

        function openBookModal() {
            document.getElementById('bookModalTitle').innerText = '새 도서 등록';
            document.getElementById('bookTitleInput').value = '';
            document.getElementById('bookAuthorInput').value = '';
            document.getElementById('bookStatusInput').value = 'reading';
            document.getElementById('bookModal').classList.remove('hidden');
        }
        function closeBookModal() {
            document.getElementById('bookModal').classList.add('hidden');
        }
        function saveBook() {
            const title = document.getElementById('bookTitleInput').value;
            const author = document.getElementById('bookAuthorInput').value;
            const status = document.getElementById('bookStatusInput').value;

            if(!title) {
                alert('책 제목을 입력해주세요.');
                return;
            }

            const newBook = {
                id: 'b_' + Date.now(),
                title, author, status
            };
            books.push(newBook);
            saveData();
            closeBookModal();
            renderBookList();
        }

        function openRecordModal() {
            const select = document.getElementById('recordBookSelect');
            select.innerHTML = '';

            const readingBooks = books.filter(b => b.status === 'reading');
            if(readingBooks.length === 0) {
                alert('기록을 추가할 수 있는 "읽는 중"인 책이 없습니다. 책을 먼저 등록해주세요.');
                return;
            }

            readingBooks.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.id;
                opt.innerText = b.title;
                select.appendChild(opt);
            });

            document.getElementById('editRecordId').value = '';
            document.getElementById('recordDateInput').value = selectedDateStr;
            document.getElementById('recordStartPageInput').value = '';
            document.getElementById('recordEndPageInput').value = '';
            document.getElementById('calculatedPages').innerText = '0';
            document.getElementById('recordMemoInput').value = '';
            document.getElementById('recordModalTitle').innerText = '독서 기록 추가';
            document.getElementById('recordModal').classList.remove('hidden');
        }

        function openRecordModalForEdit(recordId) {
            const record = records.find(r => r.id === recordId);
            if(!record) return;

            const select = document.getElementById('recordBookSelect');
            select.innerHTML = '';
            books.filter(b => b.status === 'reading' || b.id === record.bookId).forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.id;
                opt.innerText = b.title;
                if(b.id === record.bookId) opt.selected = true;
                select.appendChild(opt);
            });

            document.getElementById('editRecordId').value = record.id;
            document.getElementById('recordDateInput').value = record.date;
            document.getElementById('recordStartPageInput').value = record.startPage;
            document.getElementById('recordEndPageInput').value = record.endPage;
            document.getElementById('calculatedPages').innerText = record.pages;
            document.getElementById('recordMemoInput').value = record.memo || '';
            document.getElementById('recordModalTitle').innerText = '독서 기록 수정';
            document.getElementById('recordModal').classList.remove('hidden');
        }

        function closeRecordModal() {
            document.getElementById('recordModal').classList.add('hidden');
        }

        function calculatePages() {
            const start = parseInt(document.getElementById('recordStartPageInput').value) || 0;
            const end = parseInt(document.getElementById('recordEndPageInput').value) || 0;
            let diff = 0;
            if(end >= start) {
                diff = end - start + 1;
            }
            document.getElementById('calculatedPages').innerText = diff;
        }

        function saveRecord() {
            const recordId = document.getElementById('editRecordId').value;
            const bookId = document.getElementById('recordBookSelect').value;
            const date = document.getElementById('recordDateInput').value;
            const startPage = parseInt(document.getElementById('recordStartPageInput').value) || 0;
            const endPage = parseInt(document.getElementById('recordEndPageInput').value) || 0;
            const memo = document.getElementById('recordMemoInput').value;

            if(!date || endPage < startPage) {
                alert('날짜와 올바른 페이지 범위를 입력해주세요.');
                return;
            }

            const pages = endPage - startPage + 1;

            if(recordId) {
                const record = records.find(r => r.id === recordId);
                if(record) {
                    record.bookId = bookId;
                    record.date = date;
                    record.startPage = startPage;
                    record.endPage = endPage;
                    record.pages = pages;
                    record.memo = memo;
                }
            } else {
                const newRecord = {
                    id: 'r_' + Date.now(),
                    bookId, date, startPage, endPage, pages, memo
                };
                records.push(newRecord);
            }

            saveData();
            closeRecordModal();
            if(currentView === 'detail') {
                renderDetailRecords(bookId);
            } else {
                renderCalendar();
            }
        }

        function deleteRecord(recordId) {
            if(confirm('기록을 삭제하시겠습니까?')) {
                const record = records.find(r => r.id === recordId);
                const bookId = record ? record.bookId : null;
                records = records.filter(r => r.id !== recordId);
                saveData();
                if(currentView === 'detail' && bookId) {
                    renderDetailRecords(bookId);
                } else {
                    renderCalendar();
                }
            }
        }

        function changeCalendarPeriod(diff) {
            if(calendarMode === 'month') {
                currentDate.setMonth(currentDate.getMonth() + diff);
            } else {
                currentDate.setDate(currentDate.getDate() + (diff * 7));
            }
            renderCalendar();
        }

        function setCalendarMode(mode) {
            calendarMode = mode;
            document.getElementById('modeMonthBtn').className = mode === 'month' ? "text-sm px-3 py-1 rounded-md font-medium bg-white text-indigo-600 shadow-sm" : "text-sm px-3 py-1 rounded-md font-medium text-gray-600";
            document.getElementById('modeWeekBtn').className = mode === 'week' ? "text-sm px-3 py-1 rounded-md font-medium bg-white text-indigo-600 shadow-sm" : "text-sm px-3 py-1 rounded-md font-medium text-gray-600";
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const selectedDateSection = document.getElementById('selectedDateSection');

            if(calendarMode === 'month') {
                selectedDateSection.classList.remove('hidden');

                const headerRow = document.createElement('div');
                headerRow.className = "grid grid-cols-7 gap-1 text-center text-sm font-semibold text-gray-400 mb-2";
                ['일', '월', '화', '수', '목', '금', '토'].forEach(d => {
                    headerRow.innerHTML += `<div>${d}</div>`;
                });
                grid.appendChild(headerRow);

                const daysContainer = document.createElement('div');
                daysContainer.className = "grid grid-cols-7 gap-1";

                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();

                for(let i=0; i<firstDay; i++) {
                    daysContainer.innerHTML += `<div></div>`;
                }

                for(let d=1; d<=lastDate; d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    appendMonthDayCell(daysContainer, dateStr, d);
                }
                grid.appendChild(daysContainer);
                selectDate(selectedDateStr);

            } else {
                // 주간 모드: 하단 독서기록 요약 숨김
                selectedDateSection.classList.add('hidden');

                const startOfWeek = new Date(currentDate);
                const dayOfWeek = startOfWeek.getDay();
                startOfWeek.setDate(startOfWeek.getDate() - dayOfWeek);

                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(endOfWeek.getDate() + 6);

                document.getElementById('calendarTitle').innerText = `${startOfWeek.getFullYear()}.${String(startOfWeek.getMonth()+1).padStart(2,'0')}.${String(startOfWeek.getDate()).padStart(2,'0')} ~ ${String(endOfWeek.getMonth()+1).padStart(2,'0')}.${String(endOfWeek.getDate()).padStart(2,'0')}`;

                const weekContainer = document.createElement('div');
                weekContainer.className = "space-y-2";

                const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

                for(let i=0; i<7; i++) {
                    const loopDate = new Date(startOfWeek);
                    loopDate.setDate(loopDate.getDate() + i);
                    const year = loopDate.getFullYear();
                    const month = loopDate.getMonth() + 1;
                    const day = loopDate.getDate();
                    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dayName = dayNames[i];

                    const dayRecords = records.filter(r => r.date === dateStr);
                    const hasRecord = dayRecords.length > 0;
                    const isToday = dateStr === new Date().toISOString().split('T')[0];

                    const row = document.createElement('div');
                    row.className = `p-3 rounded-xl border flex flex-col md:flex-row justify-between items-start md:items-center gap-2 ${isToday ? 'border-indigo-500 bg-indigo-50/30' : 'border-gray-100 bg-gray-50'}`;
                    
                    let recordsHtml = '';
                    if(hasRecord) {
                        recordsHtml = dayRecords.map(r => {
                            const book = books.find(b => b.id === r.bookId);
                            return `
                                <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-gray-100 text-sm mt-1">
                                    <div>
                                        <strong class="text-gray-800">${book ? book.title : '삭제된 책'}</strong> (${r.startPage}~${r.endPage}p) : <span class="text-indigo-600 font-semibold">+${r.pages}p</span>
                                        ${r.memo ? `<span class="text-gray-400 ml-2">(${r.memo})</span>` : ''}
                                    </div>
                                    <div class="flex space-x-1 ml-2">
                                        <button onclick="openRecordModalForEdit('${r.id}')" class="px-2 py-1 bg-gray-50 border border-gray-200 rounded text-xs text-gray-600">수정</button>
                                        <button onclick="deleteRecord('${r.id}')" class="px-2 py-1 bg-gray-50 border border-red-200 rounded text-xs text-red-500">삭제</button>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        recordsHtml = `<span class="text-xs text-gray-400">기록 없음</span>`;
                    }

                    row.innerHTML = `
                        <div class="flex items-center space-x-2 min-w-[90px]">
                            <span class="font-bold text-base ${isToday ? 'text-indigo-600' : 'text-gray-700'}">${month}/${day} (${dayName})</span>
                        </div>
                        <div class="flex-1 w-full">
                            ${recordsHtml}
                        </div>
                    `;
                    weekContainer.appendChild(row);
                }
                grid.appendChild(weekContainer);
            }
        }

        function appendMonthDayCell(container, dateStr, displayNum) {
            const dayRecords = records.filter(r => r.date === dateStr);
            const hasRecord = dayRecords.length > 0;
            const isSelected = selectedDateStr === dateStr;

            const cell = document.createElement('div');
            cell.className = `h-16 border rounded-xl p-1 flex flex-col justify-between cursor-pointer transition relative ${isSelected ? 'ring-2 ring-indigo-600 bg-indigo-50/50' : (hasRecord ? 'bg-indigo-50 border-indigo-200' : 'bg-gray-50 border-gray-100')}`;
            cell.onclick = () => {
                selectDate(dateStr);
                renderCalendar();
            };

            let content = `<span class="text-sm font-bold ${isSelected ? 'text-indigo-700 underline' : (hasRecord ? 'text-indigo-600' : 'text-gray-600')}">${displayNum}</span>`;
            if(hasRecord) {
                const firstBook = books.find(b => b.id === dayRecords[0].bookId);
                content += `<span class="text-[10px] text-indigo-700 truncate">${firstBook ? firstBook.title : ''}</span>`;
            }
            cell.innerHTML = content;
            container.appendChild(cell);
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('selectedDateTitle').innerText = `${dateStr} 독서 기록`;
            const container = document.getElementById('selectedDateLogs');
            container.innerHTML = '';

            const dayRecords = records.filter(r => r.date === dateStr);
            if(dayRecords.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400">이 날의 기록이 없습니다.</p>`;
                return;
            }

            dayRecords.forEach(r => {
                const book = books.find(b => b.id === r.bookId);
                const item = document.createElement('div');
                item.className = "bg-gray-50 p-3 rounded-xl text-sm flex justify-between items-center";
                item.innerHTML = `
                    <div>
                        <strong class="text-gray-800">${book ? book.title : '삭제된 책'}</strong> (${r.startPage}~${r.endPage}p) : <span class="text-indigo-600">+${r.pages}p</span>
                        ${r.memo ? `<br><span class="text-gray-400">${r.memo}</span>` : ''}
                    </div>
                    <div class="flex space-x-1">
                        <button onclick="openRecordModalForEdit('${r.id}')" class="px-2.5 py-1.5 bg-white border border-gray-200 rounded-lg text-gray-600 text-sm">수정</button>
                        <button onclick="deleteRecord('${r.id}')" class="px-2.5 py-1.5 bg-white border border-red-200 rounded-lg text-red-500 text-sm">삭제</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function exportCSV() {
            let csvContent = "\uFEFF날짜,책제목,저자,시작페이지,끝페이지,읽은페이지수,메모\n";
            records.forEach(r => {
                const book = books.find(b => b.id === r.bookId);
                const title = book ? `"${book.title}"` : '"알 수 없음"';
                const author = book ? `"${book.author}"` : '"알 수 없음"';
                csvContent += `${r.date},${title},${author},${r.startPage},${r.endPage},${r.pages},"${r.memo || ''}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `독서기록_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        renderBookList();
    </script>
</body>
</html>
